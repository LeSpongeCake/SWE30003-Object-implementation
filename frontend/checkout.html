<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="checkout">
  <header class="topbar">
    <div>
      <p class="eyebrow">Payment</p>
      <strong>Dummy payment confirms immediately after checkout.</strong>
    </div>
    <div class="topbar-meta">
      <span class="status-pill" data-session-label>Loading session</span>
      <span class="status-pill">Cart: <strong data-cart-count>0</strong></span>
    </div>
  </header>
  <nav class="nav-shell" aria-label="Main navigation">
    <a class="nav-link" data-page-link="catalog" href="index.html">Catalog</a>
    <a class="nav-link" data-page-link="cart" href="cart.html">Cart</a>
    <a class="nav-link active" data-page-link="checkout" href="checkout.html">Payment</a>
    <a class="nav-link" data-page-link="purchases" href="purchases.html">Purchases</a>
    <a class="nav-link" data-page-link="tracking" href="tracking.html">Tracking</a>
    <a class="nav-link" data-page-link="account" href="account.html">Account</a>
    <a class="nav-link" data-page-link="guest" href="guest.html">Guest</a>
    <a class="nav-link" data-page-link="admin" href="admin.html">Admin</a>
    <a class="nav-link nav-cta" data-page-link="login" href="login.html">Login / Create</a>
  </nav>
  <main class="page-shell checkout-grid">
    <section class="content-card">
      <div class="section-head">
        <div>
          <p class="eyebrow">Order summary</p>
          <h2>Review before payment</h2>
        </div>
      </div>
      <div id="checkoutSummary"></div>
    </section>
    <section class="auth-card">
      <div class="section-head">
        <div>
          <p class="eyebrow">Payment form</p>
          <h2>Confirm purchase</h2>
        </div>
      </div>
      <form id="paymentForm" class="form-grid">
        <label class="field-stack">
          <span>Full name</span>
          <input name="fullName" type="text" required />
        </label>
        <label class="field-stack">
          <span>Email</span>
          <input name="email" type="email" required />
        </label>
        <label class="field-stack">
          <span>Address</span>
          <input name="address" type="text" placeholder="123 Example Street" required />
        </label>
        <label class="field-stack">
          <span>Shipping method</span>
          <select name="shippingMethod">
            <option value="post">Post allocation</option>
            <option value="pickup">Pickup allocation</option>
          </select>
        </label>
        <label class="field-stack">
          <span>Payment method</span>
          <select name="paymentMethod">
            <option value="card">Card</option>
            <option value="wallet">Wallet</option>
          </select>
        </label>
        <button class="button-link" type="submit">Confirm dummy payment</button>
      </form>
      <p id="checkoutMessage" class="data-message">Dummy payment confirmation only.</p>
    </section>
  </main>
  <script src="shared.js?v=8"></script>
  <script src="checkout.js?v=8"></script>
</body>
</html>
